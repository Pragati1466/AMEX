# Render Blueprint for DisputeIQ API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: disputiq-api
    env: python
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      python -m spacy download en_core_web_sm
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: DisputeIQ
      - key: APP_VERSION
        value: 1.0.0
      - key: APP_DESCRIPTION
        value: AI-Powered Multi-Agent Dispute Resolution System
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ALGORITHM
        value: HS256
      - key: CHROMA_PERSIST_DIR
        value: ./chroma_db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: sqlite:///./disputiq.db
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false